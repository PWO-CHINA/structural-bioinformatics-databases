<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构生物学数据库演进史</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        .serif { font-family: 'Noto Serif SC', serif; }
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const timelineData = [
            { year: 1958, category: "tech", era: "foundation", name: "X-ray 晶体学奠基", desc: "DNA 双螺旋与血红蛋白结构解析" },
            { year: 1971, category: "db", era: "foundation", name: "PDB 创立", provider: "Brookhaven National Lab", desc: "首个生物大分子三维结构数据库（7个初始结构）" },
            { year: 1985, category: "tech", era: "foundation", name: "NMR 波谱学应用", desc: "在溶液条件下捕捉分子动态变化" },
            { year: 2002, category: "db", era: "integration", name: "EMDB 建立", provider: "EBI", desc: "冷冻电镜三维密度图数据库" },
            { year: 2013, category: "tech", era: "integration", name: "Cryo-EM 分辨率革命", desc: "直接电子探测器突破，冷冻电镜成为主流" },
            { year: 2020, category: "tech", era: "ai", name: "AlphaFold2 突破", desc: "CASP14 竞赛历史性突破，深度学习预测准确度接近实验" },
            { year: 2021, category: "db", era: "ai", name: "AlphaFoldDB 上线", provider: "DeepMind & EBI", desc: "AI 时代：全基因组级预测结构数据库，覆盖数千万条目", highlight: true }
        ];

        const eras = {
            foundation: { title: "1950s-1990s: 实验奠基与知识体系", color: "blue" },
            integration: { title: "2000s-2010s: 技术爆炸与多模态整合", color: "emerald" },
            ai: { title: "2020s-Present: AI 革命与数字孪生", color: "purple" }
        };

        const TimelineItem = ({ item }) => {
            const isDb = item.category === 'db';
            return (
                <div className={`relative flex items-center w-full mb-8 ${isDb ? 'md:flex-row-reverse' : ''}`}>
                    <div className={`absolute left-8 md:left-1/2 w-3 h-3 -ml-1.5 rounded-full z-10 border-2 border-white shadow-sm ${
                        isDb ? 'bg-blue-500' : 'bg-slate-600'
                    }`}></div>
                    <div className={`w-[calc(100%-3rem)] md:w-[45%] ml-12 md:ml-0 ${isDb ? 'md:ml-[55%]' : 'md:mr-[55%]'} ${item.highlight ? 'scale-105' : ''}`}>
                        <div className={`p-4 rounded-lg border transition-all ${
                            isDb 
                                ? `bg-white shadow-sm ${item.highlight ? 'ring-2 ring-purple-100 border-purple-300' : 'border-slate-200'}` 
                                : 'bg-slate-800 border-slate-700 text-slate-100'
                        }`}>
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-xl font-bold serif text-slate-900">{item.year}</span>
                                <span className={`text-xs font-medium px-2 py-1 rounded-full ${
                                    isDb ? 'bg-blue-100 text-blue-800' : 'bg-slate-700 text-slate-300'
                                }`}>
                                    {isDb ? '数据库' : '技术基线'}
                                </span>
                            </div>
                            <h3 className={`font-bold mb-1 ${isDb ? 'text-slate-800' : 'text-white'}`}>{item.name}</h3>
                            {isDb && <p className={`text-xs ${isDb ? 'text-slate-500' : 'text-slate-300'}`}>{item.provider}</p>}
                            <p className={`text-sm mt-2 leading-relaxed ${isDb ? 'text-slate-600' : 'text-slate-300'}`}>{item.desc}</p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const groupedData = {};
            timelineData.forEach(item => {
                if (!groupedData[item.era]) groupedData[item.era] = [];
                groupedData[item.era].push(item);
            });

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-slate-200 py-16 mb-8">
                        <div className="max-w-4xl mx-auto px-4 text-center">
                            <h1 className="text-4xl font-bold text-slate-900 serif mb-4">
                                结构生物学数据库演进史
                            </h1>
                            <p className="text-slate-600 text-lg">
                                探索技术突破与数据增长的<span className="font-bold">双螺旋</span>效应
                            </p>
                        </div>
                    </header>

                    <div className="max-w-6xl mx-auto px-4 relative">
                        <div className="timeline-line"></div>

                        {Object.entries(groupedData).map(([eraKey, items]) => (
                            <div key={eraKey} className="mb-20">
                                <div className="flex justify-center mb-8">
                                    <div className={`px-6 py-3 rounded-full bg-white shadow-sm border-2 ${
                                        eraKey === 'foundation' ? 'border-blue-500' :
                                        eraKey === 'integration' ? 'border-emerald-500' :
                                        'border-purple-500'
                                    }`}>
                                        <h2 className="font-bold text-center">{eras[eraKey].title}</h2>
                                    </div>
                                </div>
                                {items.map((item, idx) => <TimelineItem key={idx} item={item} />)}
                            </div>
                        ))}

                        <div className="flex justify-center pt-8">
                            <div className="bg-slate-900 text-white px-8 py-4 rounded-xl shadow-xl border border-slate-700 text-center">
                                <p className="font-bold text-lg">未来展望</p>
                                <p className="text-sm text-slate-400">迈向 AI 原生与数字孪生架构</p>
                            </div>
                        </div>
                    </div>
                    
                    <footer className="text-center text-slate-400 text-sm py-12 mt-12">
                        基于结构生物学相关文献整理
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
