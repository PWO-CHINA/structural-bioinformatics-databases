<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>结构生物信息学常用数据库（亮色版/可检索）</title>
<style>
  :root {
    /* 核心色板：亮色系 */
    --bg: #f8fafc;           /* 整体背景：极淡灰蓝 */
    --panel: #ffffff;        /* 主要面板：纯白 */
    --panel-header: #f1f5f9; /* 表头背景：淡灰 */
    --panel-inset: #f8fafc;  /* 详情内嵌背景 */
    
    --text: #0f172a;         /* 主文字：深蓝黑 */
    --text-sec: #64748b;     /* 次要文字：中灰 */
    --primary: #2563eb;      /* 主题色：科学蓝 */
    --primary-light: #eff6ff;/* 主题色淡背景 */
    
    --line: #e2e8f0;         /* 分割线：浅灰 */
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); /* 柔和投影 */
    --focus-ring: rgba(37, 99, 235, 0.2);
    
    --r: 12px; /* 圆角半径 */
    
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background-color: var(--bg);
    /* 顶部细微渐变，模拟光照，不再是暗夜极光 */
    background-image: 
      radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }

  /* 顶部导航栏 */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.85); /* 毛玻璃效果 */
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px; }
  
  h1 { margin: 0; font-size: 22px; color: var(--text); font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin-top: 6px; color: var(--text-sec); font-size: 14px; line-height: 1.5; }
  
  /* 计数徽章 */
  .badge {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary);
    font-weight: 600; font-size: 13px; margin-left: 10px;
    border: 1px solid rgba(37, 99, 235, 0.1);
  }

  /* 搜索与筛选区域 */
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

  input[type="search"], select, button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px; /* 稍微方一点，更现代 */
    padding: 10px 14px;
    outline: none;
    font-size: 14px;
    transition: all 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }

  input[type="search"]:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  input[type="search"] { flex: 1 1 380px; }
  select { flex: 0 1 160px; cursor: pointer; }
  
  button { 
    cursor: pointer; font-weight: 500; 
    background: #fff;
  }
  button:hover { 
    background: var(--primary-light); 
    border-color: var(--primary); 
    color: var(--primary);
  }
  
  /* 导出按钮特殊样式 */
  #export {
    background: var(--primary); color: white; border-color: var(--primary);
  }
  #export:hover {
    background: #1d4ed8; border-color: #1d4ed8; /* Darker Blue */
    color: white;
  }

  /* 表格容器 */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow-x: auto;
    overflow-y: hidden;
    margin-top: 20px;
    scrollbar-gutter: stable;
  }

  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  
  /* 表头 */
  th {
    background: var(--panel-header);
    color: var(--text-sec);
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 14px 12px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--primary); background: #e2e8f0; }

  td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    font-size: 14px;
    color: #334155; /* Slate 700 */
    line-height: 1.5;
  }

  /* 斑马纹与悬停 */
  tbody tr { transition: background 0.15s; }
  tbody tr:hover td { background: var(--primary-light); }
  
  /* 标签 Pill 样式 - 亮色版核心改动：淡背景深色字 */
  .pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 6px;
    font-size: 12px; white-space: nowrap; font-weight: 500;
    margin-right: 4px; margin-bottom: 4px;
    background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; /* 默认灰 */
  }
  
  /* 类型列的 Pill */
  td:first-child .pill {
    background: #f0f9ff; border-color: #bae6fd; color: #0369a1; /* Sky Blue */
    font-weight: 600;
  }
  
  /* 蓝色标签 (Tags) */
  .pill.blue {
    background: #eef2ff; border-color: #c7d2fe; color: #4338ca; /* Indigo */
  }

  /* 按钮微调 */
  .btn-sm {
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
  }

  /* 详情区域 */
  .details-row td {
    background: #f8fafc !important; /* 区别于白色的灰色底 */
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.03); /* 内部阴影 */
    padding: 20px;
  }
  
  .details {
    display: grid; gap: 16px; grid-template-columns: 1.2fr 1.2fr 1fr;
  }

  /* 详情卡片 */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  
  .card h3 {
    margin: 0 0 10px 0; font-size: 13px; color: var(--text-sec);
    text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #f1f5f9;
    padding-bottom: 6px;
  }

  .mono { font-family: var(--mono); font-size: 12px; color: var(--primary); }
  .muted { color: var(--text-sec); }
  
  ul { margin: 0; padding-left: 18px; color: var(--text); }
  li { margin: 6px 0; }
  
  a { color: var(--primary); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; color: #1d4ed8; }

  /* 排序箭头 */
  .si { display: inline-block; width: 12px; text-align: center; color: var(--primary); font-weight: bold; margin-left: 4px;}

  /* 底部 */
  .foot { margin-top: 20px; color: var(--text-sec); font-size: 13px; text-align: center; }

  /* 冻结列处理 - 亮色版适配 */
  th:last-child, td:last-child { 
    position: sticky; right: 0; z-index: 2; 
    border-left: 1px solid var(--line); /* 添加左边框以分隔 */
    text-align: center;
  }
  
  thead th:last-child {
    background: var(--panel-header); /* 与表头一致 */
    z-index: 3;
    box-shadow: -4px 0 8px -4px rgba(0,0,0,0.05); /* 左侧阴影 */
  }
  
  tbody tr:not(.details-row) td:last-child {
    background: rgba(255,255,255,0.95); /* 半透明白 */
    backdrop-filter: blur(4px);
    box-shadow: -4px 0 8px -4px rgba(0,0,0,0.05);
  }

  /* 悬停时，冻结列背景也要变色，否则会有白色方块遮挡 */
  tbody tr:hover td:last-child {
    background: var(--primary-light);
  }

  /* 响应式 */
  @media (max-width: 980px) {
    .details { grid-template-columns: 1fr; }
    .wrap { padding: 10px 12px; }
    input[type="search"] { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;">
      <div>
        <h1>结构生物信息学常用数据库 <span class="badge" id="count"></span></h1>
        <div class="sub">基于PDF数据整理：支持检索、多维筛选、排序与详情查看（亮色护眼版）。</div>
      </div>
      <!-- 隐藏的小提示 -->
      <div class="sub mono" style="font-size:12px;color:var(--text-sec);">点击表头排序 | 点击“详情”查看完整信息</div>
    </div>

    <div class="row">
      <input id="q" type="search" placeholder="输入关键词检索：PDB, 结构, 膜蛋白, 药物发现..." autocomplete="off" />
      <select id="type"><option value="">所有类型</option></select>
      <select id="tag">
        <option value="">所有标签</option>
        <option value="结构">结构</option>
        <option value="分类">分类</option>
        <option value="功能注释">功能注释</option>
        <option value="相互作用">相互作用</option>
        <option value="专题">专题</option>
        <option value="预测">预测</option>
        <option value="AI训练">AI训练</option>
        <option value="Cryo-EM">Cryo-EM</option>
        <option value="膜蛋白">膜蛋白</option>
        <option value="核酸">核酸</option>
        <option value="无序蛋白">无序蛋白</option>
        <option value="药物发现">药物发现</option>
      </select>
      <select id="action">
        <option value="">批量操作</option>
        <option value="reset">重置筛选</option>
        <option value="collapse">全部收起</option>
        <option value="expand">全部展开</option>
      </select>
      <button class="btn" id="export">导出JSON</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th data-key="db_type" style="width:100px;">类型<span class="si" id="si-db_type"></span></th>
            <th data-key="name" style="width:140px;">名称<span class="si" id="si-name"></span></th>
            <th data-key="main_data_type" style="width:260px;">主要数据类型<span class="si" id="si-main_data_type"></span></th>
            <th data-key="function" style="width:220px;">功能定位<span class="si" id="si-function"></span></th>
            <th data-key="use_case" style="width:220px;">应用场景<span class="si" id="si-use_case"></span></th>
            <th data-key="maintainer" style="width:160px;">维护机构<span class="si" id="si-maintainer"></span></th>
            <th style="width:80px;">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="foot">
      数据来源：结构生物信息学相关文献整理。包含建立时间、规模、特征、AI相关性及访问入口。
    </div>
  </div>
</main>

const qEl = document.getElementById('q');
const typeEl = document.getElementById('type');
const tagEl = document.getElementById('tag');
const actionEl = document.getElementById('action');
const tbody = document.getElementById('tbody');
const countEl = document.getElementById('count');
const exportBtn = document.getElementById('export');

let sortKey = 'db_type';
let sortDir = 'asc';

function norm(x) {
  return (x ?? '').toString().toLowerCase();
}
function esc(s) {
  return (s ?? '').toString()
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#39;");
}
function hasTag(item, tag) {
  if (!tag) return true;
  return (item.tags || []).some(t => t === tag);
}
function sortData(arr) {
  const dir = (sortDir === 'asc') ? 1 : -1;
  const key = sortKey;
  const out = arr.slice();
  out.sort((a,b) => {
    const va = norm(a[key]);
    const vb = norm(b[key]);
    if (va < vb) return -1*dir;
    if (va > vb) return 1*dir;
    return norm(a.name) < norm(b.name) ? -1 : (norm(a.name) > norm(b.name) ? 1 : 0);
  });
  return out;
}
function setSortIndicators() {
  document.querySelectorAll('.si').forEach(el => el.textContent = '');
  const el = document.getElementById('si-' + sortKey);
  if (el) el.textContent = (sortDir === 'asc') ? '↑' : '↓';
}
function linkList(links) {
  if (!links || !links.length) return '<span class="muted">—</span>';
  return links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' · ');
}

function render() {
  const q = norm(qEl.value).trim();
  const t = typeEl.value;
  const tag = tagEl.value;

  let filtered = DATA.filter(item => {
    if (t && item.db_type !== t) return false;
    if (!hasTag(item, tag)) return false;
    if (!q) return true;
    const hay = [
      item.db_type, item.name, item.full_name, item.main_data_type, item.function, item.use_case,
      item.established, item.maintainer, item.scale, item.access, item.pdf_refs,
      (item.key_features||[]).join(' '), (item.ai_relevance||[]).join(' '), (item.relationships||[]).join(' '),
      (item.links||[]).map(x => x.label + ' ' + x.url).join(' '),
      (item.tags||[]).join(' ')
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });

  filtered = sortData(filtered);

  tbody.innerHTML = '';
  countEl.textContent = `${filtered.length} / ${DATA.length}`;

  filtered.forEach((item) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="pill">${esc(item.db_type)}</span></td>
      <td>
        <div style="font-weight:700;color:var(--text);">${esc(item.name)}</div>
        <div class="muted" style="margin-top:4px;font-size:12px;">${esc(item.full_name||'')}</div>
        <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">
          ${(item.tags||[]).slice(0,3).map(t => `<span class="pill blue">${esc(t)}</span>`).join('')}
        </div>
      </td>
      <td>${esc(item.main_data_type)}</td>
      <td>${esc(item.function)}</td>
      <td>${esc(item.use_case)}</td>
      <td>${esc(item.maintainer || '—')}</td>
      <td><button class="btn-sm" data-act="toggle">详情</button></td>
    `;
    tbody.appendChild(tr);

    const dtr = document.createElement('tr');
    dtr.className = 'details-row';
    dtr.style.display = 'none';
    dtr.innerHTML = `
      <td colspan="7">
        <div class="details">
          <div class="card">
            <h3>建立时间 / 规模 / PDF依据</h3>
            <div><b>建立：</b>${esc(item.established||'—')}</div>
            <div style="margin-top:8px;"><b>规模：</b>${esc(item.scale||'—')}</div>
            <div style="margin-top:8px;" class="muted"><b>PDF参考：</b>${esc(item.pdf_refs||'—')}</div>
          </div>
          <div class="card">
            <h3>关键特征 & AI相关性</h3>
            <ul>
              ${(item.key_features||[]).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="muted">—</li>'}
            </ul>
            <div style="margin-top:12px;font-weight:600;color:var(--text-sec);">AI关联：</div>
            <ul>
              ${(item.ai_relevance||[]).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="muted">—</li>'}
            </ul>
          </div>
          <div class="card">
            <h3>访问与生态</h3>
            <div><b>访问：</b>${esc(item.access||'—')}</div>
            <div style="margin-top:8px;"><b>关系：</b>${
              (item.relationships||[]).length
                ? `<ul>${item.relationships.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
                : '<span class="muted">—</span>'
            }</div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9;" class="mono">${linkList(item.links)}</div>
          </div>
        </div>
      </td>
    `;
    tbody.appendChild(dtr);
  });

  setSortIndicators();
}

function collapseAll() {
  document.querySelectorAll('.details-row').forEach(r => r.style.display = 'none');
  document.querySelectorAll('button[data-act="toggle"]').forEach(b => b.textContent = '详情');
}
function expandAll() {
  document.querySelectorAll('.details-row').forEach(r => r.style.display = '');
  document.querySelectorAll('button[data-act="toggle"]').forEach(b => b.textContent = '收起');
}

tbody.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act="toggle"]');
  if (!btn) return;
  const row = btn.closest('tr');
  const next = row.nextElementSibling;
  if (!next || !next.classList.contains('details-row')) return;
  const open = (next.style.display !== 'none');
  next.style.display = open ? 'none' : '';
  btn.textContent = open ? '详情' : '收起';
});

document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.getAttribute('data-key');
    if (sortKey === k) sortDir = (sortDir === 'asc') ? 'desc' : 'asc';
    else { sortKey = k; sortDir = 'asc'; }
    render();
  });
});

[qEl, typeEl, tagEl].forEach(el => el.addEventListener('input', render));

actionEl.addEventListener('change', () => {
  const v = actionEl.value;
  actionEl.value = '';
  if (v === 'reset') {
    qEl.value = ''; typeEl.value = ''; tagEl.value = '';
    sortKey = 'db_type'; sortDir = 'asc';
    render();
  } else if (v === 'collapse') {
    collapseAll();
  } else if (v === 'expand') {
    expandAll();
  }
});

exportBtn.addEventListener('click', () => {
  const q = norm(qEl.value).trim();
  const t = typeEl.value;
  const tag = tagEl.value;

  let filtered = DATA.filter(item => {
    if (t && item.db_type !== t) return false;
    if (!hasTag(item, tag)) return false;
    if (!q) return true;
    const hay = [
      item.db_type, item.name, item.full_name, item.main_data_type, item.function, item.use_case,
      item.established, item.maintainer, item.scale, item.access, item.pdf_refs,
      (item.key_features||[]).join(' '), (item.ai_relevance||[]).join(' '), (item.relationships||[]).join(' '),
      (item.links||[]).map(x => x.label + ' ' + x.url).join(' '),
      (item.tags||[]).join(' ')
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });
  filtered = sortData(filtered);

  const blob = new Blob([JSON.stringify(filtered, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '结构生物信息学数据库_筛选结果.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// build type options
[...new Set(DATA.map(d => d.db_type))].forEach(t => {
  const o = document.createElement('option');
  o.value = t; o.textContent = t;
  typeEl.appendChild(o);
});

render();
</script>
</body>
</html>
